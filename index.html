<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <link rel="stylesheet" href="css/leaflet-measure.css">
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        .title-with-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-with-logo img {
            height: 44px;
            width: auto;
            object-fit: contain;
            flex-shrink: 0;
        }

        .title-with-logo h2 {
            margin: 0;
            line-height: 1.15;
        }

        @media (max-width: 600px) {
            .title-with-logo {
                gap: 7px;
            }

            .title-with-logo img {
                height: 34px;
            }

            .title-with-logo h2 {
                font-size: 16px;
            }
        }
    </style>
    <title>Peta Interaktif RW 009 Malaka Sari</title>
</head>

<body>
    <div id="map">
    </div>
    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="js/leaflet-measure.js"></script>
    <script src="data/BatasRT_3.js"></script>
    <script>
        var highlightLayer;
        function highlightFeature(e) {

            // Jangan highlight Batas RT saat zoom di bawah 17
            if (map.getZoom() < 17) {
                return;
            }

            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString') {
                highlightLayer.setStyle({
                    color: '#ffff00'
                });
            } else {
                highlightLayer.setStyle({
                    color: '#ffff00',
                    weight: 1,
                    fillColor: '#ffff00',
                    fillOpacity: 0.20
                });
            }

            // highlightLayer.openPopup();
        }

        var map = L.map('map', {
            zoomControl: false, maxZoom: 23, minZoom: 14
        }).fitBounds([[-6.233201292845014, 106.9249968185847], [-6.228267445160231, 106.93371223722342]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function () {
                                popup.update();
                            });
                            img.addEventListener('error', function () {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function () {
                        popup.update();
                    });
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({ 'position': 'topleft' });
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML =
                '<div class="title-with-logo">' +
                '<img src="images/logo-rw-009.png" alt="Logo RW 009">' +
                '<h2>Peta Interaktif RW 009<br>Malaka Sari</h2>' +
                '</div>';
        };
        title.addTo(map);
        var abstract = new L.Control({ 'position': 'topleft' });
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
                'leaflet-control abstract');
            this._div.id = 'abstract'

            abstract.show();
            return this._div;
        };
        abstract.show = function () {
            this._div.classList.remove("abstract");
            this._div.classList.add("abstractUncollapsed");
            this._div.innerHTML = 'Foto udara diambil pada tanggal 24 September 2026, dilengkapi informasi batas wilayah setiap RT di RW 009 Malaka Sari.<br /><br />© Karang Taruna RW 009 Malaka Sari';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OpenStreetMapHOT_0');
        map.getPane('pane_OpenStreetMapHOT_0').style.zIndex = 400;
        var layer_OpenStreetMapHOT_0 = L.tileLayer('https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMapHOT_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 14,
            maxZoom: 23,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_OpenStreetMapHOT_0;
        map.addLayer(layer_OpenStreetMapHOT_0);
        map.createPane('pane_GoogleSatelite_1');
        map.getPane('pane_GoogleSatelite_1').style.zIndex = 401;
        var layer_GoogleSatelite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatelite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 14,
            maxZoom: 23,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_GoogleSatelite_1;
        map.createPane('pane_OrthophotoDroneRW009MalakSari24September2026_2');
        map.getPane('pane_OrthophotoDroneRW009MalakSari24September2026_2').style.zIndex = 402;
        var layer_OrthophotoDroneRW009MalakSari24September2026_2 = L.tileLayer('https://pub-7e62d9e579154bbfb53e924930d63448.r2.dev/{z}/{x}/{y}.png', {
            pane: 'pane_OrthophotoDroneRW009MalakSari24September2026_2',
            opacity: 1.0,
            attribution: '',
            minZoom: 14,
            maxZoom: 23,
            minNativeZoom: 14,
            maxNativeZoom: 23
        });
        layer_OrthophotoDroneRW009MalakSari24September2026_2;
        map.addLayer(layer_OrthophotoDroneRW009MalakSari24September2026_2);
        function pop_BatasRT_3(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    layer_BatasRT_3.resetStyle(e.target);

                    // tetap sembunyikan outline kalau zoom < 17
                    if (map.getZoom() < 17) {
                        e.target.setStyle({
                            opacity: 0,
                            fillOpacity: 0
                        });
                    }
                },

                mouseover: function (e) {

                    // Zoom jauh: jangan tampilkan highlight
                    if (map.getZoom() < 17) {
                        return;
                    }

                    highlightFeature(e);
                }
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">keterangan</th>\
                        <td class="visible-with-data" id="keterangan">' + (feature.properties['keterangan'] !== null ? autolinker.link(String(feature.properties['keterangan']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['sumber'] !== null ? autolinker.link(String(feature.properties['sumber']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_BatasRT_3_0() {
            return {
                pane: 'pane_BatasRT_3',
                opacity: 1,
                color: 'rgba(235,244,25,1.0)',
                dashArray: '10.0,8.0',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_BatasRT_3');
        map.getPane('pane_BatasRT_3').style.zIndex = 403;
        map.getPane('pane_BatasRT_3').style['mix-blend-mode'] = 'normal';
        var layer_BatasRT_3 = new L.geoJson(json_BatasRT_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_BatasRT_3',
            layerName: 'layer_BatasRT_3',
            pane: 'pane_BatasRT_3',
            onEachFeature: pop_BatasRT_3,
            style: style_BatasRT_3_0,
        });
        bounds_group.addLayer(layer_BatasRT_3);
        map.addLayer(layer_BatasRT_3);
        var overlaysTree = [
            {
                label: '<b>Peta RW 009 Malaka Sari</b>', selectAllCheckbox: true, children: [
                    { label: '<img src="legend/BatasRT_3.png" /> Batas RT', layer: layer_BatasRT_3 },
                    { label: "Orthophoto Drone RW 009 Malaka Sari", layer: layer_OrthophotoDroneRW009MalakSari24September2026_2 },]
            },
            {
                label: '<b>Basemap</b>', selectAllCheckbox: true, children: [
                    { label: "Google Satelite", layer: layer_GoogleSatelite_1, radioGroup: 'bm' },
                    { label: "OpenStreetMap HOT", layer: layer_OpenStreetMapHOT_0, radioGroup: 'bm' },]
            },]
        var lay = L.control.layers.tree(null, overlaysTree, {
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_BatasRT_3.eachLayer(function (layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['label'] !== null ? String('<div style="color: #ffffff; font-size: 11pt; font-weight: bold; font-family: \'Century Gothic\', sans-serif;">' + layer.feature.properties['label']).replace(/\\n/g, '<br>') + '</div>' : ''), { permanent: true, offset: (layer.feature.properties['rt'] === '009' ? [-90, -16] : [-25, -16]), className: 'css_BatasRT_3' });
            labels.push(layer);
            totalMarkers += 1;
            layer.added = true;
            addLabel(layer, i);
            i++;
        });
        resetLabels([layer_BatasRT_3]);
        map.on("zoomend", function () {
            resetLabels([layer_BatasRT_3]);
        });
        map.on("layeradd", function () {
            resetLabels([layer_BatasRT_3]);
        });
        map.on("layerremove", function () {
            resetLabels([layer_BatasRT_3]);
        });

        // Setting Scale Dependent Visibility
        const rtLayer = layer_BatasRT_3;   // sesuaikan dengan nama variabel Anda
        const ZOOM_OUTLINE_RT = 17;
        const ZOOM_LABEL_RT = 18;

        function updateRtVisibility() {
            const z = map.getZoom();

            rtLayer.eachLayer(function (featureLayer) {

                // Zoom jauh: sembunyikan outline + label
                if (z < ZOOM_OUTLINE_RT) {
                    featureLayer.setStyle({
                        opacity: 0,
                        fillOpacity: 0
                    });
                    featureLayer.closeTooltip();
                    return;
                }

                // Kembalikan style asli qgis2web
                rtLayer.resetStyle(featureLayer);

                // Label hanya mulai zoom 18
                if (z >= ZOOM_LABEL_RT) {
                    featureLayer.openTooltip();
                } else {
                    featureLayer.closeTooltip();
                }
            });
        }

        map.on('zoomend', updateRtVisibility);
        updateRtVisibility();
    </script>
</body>

</html>
